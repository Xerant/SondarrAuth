name: Publish Sondarr.Media.Shared

on:
  push:
    tags:
      - "media-v*"    # e.g. media-v1.0.0 -> publishes Sondarr.Media.Shared 1.0.0
  workflow_dispatch:  # manual run publishes the <Version> from the .csproj

permissions:
  contents: read
  packages: write     # lets GITHUB_TOKEN push to GitHub Packages

env:
  PROJECT: Sondarr.Media.Shared/Sondarr.Media.Shared.csproj
  TESTS: Sondarr.Media.Shared.Tests/Sondarr.Media.Shared.Tests.csproj
  NUGET_SOURCE: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve package version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "args=-p:Version=${GITHUB_REF_NAME#media-v}" >> "$GITHUB_OUTPUT"
          else
            echo "args=" >> "$GITHUB_OUTPUT"
          fi

      - name: Test
        run: dotnet test ${{ env.TESTS }} -c Release

      - name: Pack
        run: dotnet pack ${{ env.PROJECT }} -c Release -o ./artifacts ${{ steps.version.outputs.args }}

      - name: Push to GitHub Packages
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --source "${{ env.NUGET_SOURCE }}"
          --api-key "${{ secrets.GITHUB_TOKEN }}"
          --skip-duplicate
